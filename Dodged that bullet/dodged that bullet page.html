<title>Dogded That Bullet Improved unfinished</title>

<style>
body{
color:#fff;
font-family:sans-serif;
overflow:hidden;
margin:0;
padding:0
}

:root,body.is-fullscreen{
background-color:#000
}

[hidden]{
display:none!important
}

h1{
font-weight:normal
}

a{
color:inherit;
text-decoration:underline;
cursor:pointer
}

#app,#loading,#error,#launch{
position:absolute;
top:0;
left:0;
width:100%;
height:100%
}

.screen{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
cursor:default;
user-select:none;
-webkit-user-select:none;
background-color:#000
}

#launch{
background-color:rgba(0,0,0,.92);
cursor:default;
z-index:10000
}

.launch-title{
font-size:42px;
margin:0 0 30px;
font-weight:bold
}

.controls{
display:flex;
gap:50px;
margin-bottom:35px
}

.control-box{
min-width:200px;
padding:20px;
border:2px solid rgba(255,255,255,.35);
border-radius:12px;
background:rgba(255,255,255,.08)
}

.control-box h2{
margin:0 0 12px;
font-size:24px
}

.control-box p{
margin:0;
font-size:20px
}

.start-button{
padding:16px 45px;
font-size:24px;
font-weight:bold;
color:#fff;
background:#ff4c4c;
border:0;
border-radius:10px;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.4)
}

.start-button:hover{
background:#ff6666
}

.countdown{
font-size:80px;
font-weight:bold;
margin-top:20px
}

.green-flag{
width:80px;
height:80px;
padding:16px;
border-radius:100%;
background:rgba(255,255,255,.75);
border:3px solid hsla(0,100%,100%,1);
display:flex;
justify-content:center;
align-items:center;
box-sizing:border-box
}

.progress-bar-outer{
border:1px solid currentColor;
height:10px;
width:200px;
max-width:200px
}

.progress-bar-inner{
height:100%;
width:0;
background-color:currentColor
}

.loading-text,noscript{
font-weight:normal;
font-size:36px;
margin:0 0 16px
}

.loading-image{
margin:0 0 16px
}

#error-message,#error-stack{
font-family:monospace;
max-width:600px;
white-space:pre-wrap;
user-select:text;
-webkit-user-select:text
}

#error-stack{
text-align:left;
max-height:200px;
overflow:auto
}

.control-button{
width:2rem;
height:2rem;
padding:.375rem;
margin-top:.5rem;
margin-bottom:.5rem;
user-select:none;
-webkit-user-select:none;
cursor:pointer;
border:0;
border-radius:4px
}

.control-button-highlight:hover{
background:#ff4c4c26
}

.control-button-highlight.active{
background:#ff4c4c59
}

.fullscreen-button{
background:#fff
}

.standalone-fullscreen-button{
position:absolute;
top:0;
right:0;
background-color:rgba(0,0,0,.5);
border-radius:0 0 0 4px;
padding:4px;
cursor:pointer
}

.sc-canvas{
cursor:auto
}

.sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color{
background-color:#ff8c1a
}

.sc-monitor-row-value-outer{
background-color:#fc662c
}

.sc-monitor-row-value-editing .sc-monitor-row-value-outer{
background-color:#e25b27
}

#mobile-joystick{
position:fixed;
bottom:16px;
left:16px;
width:100px;
height:100px;
z-index:9999;
touch-action:none;
display:none;
-webkit-user-select:none;
user-select:none;
pointer-events:auto;
cursor:grab
}

#mobile-joystick:active{
cursor:grabbing
}

.joystick-base{
position:relative;
width:100%;
height:100%;
box-sizing:border-box;
border-radius:50%;
background:rgba(0,0,0,.22);
border:1px solid rgba(255,255,255,.55);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 4px 12px rgba(0,0,0,.25);
overflow:visible
}

.joystick-knob{
width:40px;
height:40px;
border-radius:50%;
background:rgba(255,255,255,.95);
box-shadow:0 2px 6px rgba(0,0,0,.25);
transform:translate(0,0);
transition:transform .06s linear;
will-change:transform;
pointer-events:none
}

@media (hover:none) and (pointer:coarse),(max-width:900px){
#mobile-joystick{
display:block
}
}

@media (max-width:600px){
.launch-title{
font-size:30px
}

.controls{
flex-direction:column;
gap:15px;
margin-bottom:25px
}

.control-box{
min-width:220px;
padding:14px
}

.control-box h2{
font-size:20px
}

.control-box p{
font-size:17px
}

.start-button{
font-size:20px;
padding:14px 35px
}
}
</style>

<meta name="theme-color" content="#000000">
</head>

<body>

<div id="app"></div>

<div id="launch" class="screen" hidden>

<h1 class="launch-title" id="launch-title">
Dogded That Bullet
</h1>

<div id="controls-content">

<div class="controls">

<div class="control-box">
<h2>Computer</h2>
<p><strong>W A S D</strong> to move</p>
</div>

<div class="control-box">
<h2>Mobile</h2>
<p>Use the <strong>joystick</strong> to move</p>
</div>

</div>

<button class="start-button" id="start-button">
START GAME
</button>

</div>

<div id="countdown-content" hidden>

<div>Get ready!</div>
<div class="countdown" id="countdown">5</div>

</div>

</div>

<div id="loading" class="screen">

<noscript>Enable JavaScript</noscript>

<div class="progress-bar-outer">
<div class="progress-bar-inner" id="loading-inner"></div>
</div>

</div>

<div id="error" class="screen" hidden>

<h1>Error</h1>

<details>

<summary id="error-message"></summary>

<p id="error-stack"></p>

</details>

</div>

<div id="mobile-joystick" aria-hidden="true" title="Virtual joystick">

<div class="joystick-base">

<div class="joystick-knob"></div>

</div>

</div>

<script src="script.js"></script>

<script>

const appElement=document.getElementById('app');

const launchScreen=document.getElementById('launch');

const loadingScreen=document.getElementById('loading');

const loadingInner=document.getElementById('loading-inner');

const errorScreen=document.getElementById('error');

const errorScreenMessage=document.getElementById('error-message');

const errorScreenStack=document.getElementById('error-stack');

const startButton=document.getElementById('start-button');

const controlsContent=document.getElementById('controls-content');

const countdownContent=document.getElementById('countdown-content');

const countdownElement=document.getElementById('countdown');


const handleError=(error)=>{

console.error(error);

if(!errorScreen.hidden)return;

errorScreen.hidden=false;

errorScreenMessage.textContent=''+error;

let debug=error&&error.stack||'no stack';

debug+='\nUser agent: '+navigator.userAgent;

errorScreenStack.textContent=debug;

};


const setProgress=(progress)=>{

if(loadingInner){

loadingInner.style.width=progress*100+'%';

}

};


const interpolate=(a,b,t)=>a+t*(b-a);


try{

setProgress(.1);


const scaffolding=new Scaffolding.Scaffolding();


scaffolding.width=480;

scaffolding.height=360;

scaffolding.resizeMode="preserve-ratio";

scaffolding.editableLists=false;

scaffolding.usePackagedRuntime=true;


scaffolding.setup();

scaffolding.appendTo(appElement);


const vm=scaffolding.vm;


window.scaffolding=scaffolding;

window.vm=scaffolding.vm;


window.Scratch={

vm,

renderer:vm.renderer,

audioEngine:vm.runtime.audioEngine,

bitmapAdapter:vm.runtime.v2BitmapAdapter,

videoProvider:vm.runtime.ioDevices.video.provider

};


scaffolding.setUsername(

"player####".replace(

/#/g,

()=>Math.floor(Math.random()*10)

)

);


scaffolding.setAccentColor("#ff4c4c");


try{

scaffolding.addCloudProvider(

new Scaffolding.Cloud.WebSocketProvider(

[

"wss://clouddata.turbowarp.org",

"wss://clouddata.turbowarp.xyz"

],

"p4-@Dogded That Bullet Improved unfinished.sb3"

)

);

}catch(error){

console.error(error);

}


vm.setTurboMode(false);


if(vm.setInterpolation){

vm.setInterpolation(false);

}


if(vm.setFramerate){

vm.setFramerate(30);

}


if(vm.renderer.setUseHighQualityRender){

vm.renderer.setUseHighQualityRender(false);

}


if(vm.setRuntimeOptions){

vm.setRuntimeOptions({

fencing:true,

miscLimits:true,

maxClones:300

});

}


if(vm.setCompilerOptions){

vm.setCompilerOptions({

enabled:true,

warpTimer:false

});

}


if(vm.renderer.setMaxTextureDimension){

vm.renderer.setMaxTextureDimension(2048);

}


if(vm.runtime.setEnforcePrivacy){

vm.runtime.setEnforcePrivacy(false);

}


if(typeof ScaffoldingAddons!=='undefined'){

ScaffoldingAddons.run(

scaffolding,

{

"gamepad":false,

"pointerlock":false,

"specialCloudBehaviors":false,

"unsafeCloudBehaviors":false,

"pause":false

}

);

}


scaffolding.setExtensionSecurityManager({

getSandboxMode:()=> 'unsandboxed',

canLoadExtensionFromProject:()=>true

});


for(const extension of[]){

vm.extensionManager.loadExtensionURL(extension);

}


}catch(e){

handleError(e);

}

</script>


<script>

const getProjectData=(function(){

const storage=scaffolding.storage;


storage.onprogress=(total,loaded)=>{

setProgress(

interpolate(.2,.98,loaded/total)

);

};


storage.addWebStore(

[

storage.AssetType.ImageVector,

storage.AssetType.ImageBitmap,

storage.AssetType.Sound,

storage.AssetType.Font

].filter(i=>i),

(asset)=>

new URL(

'./assets/'+

asset.assetId+'.'+

asset.dataFormat,

location

).href

);


return()=>new Promise((resolve,reject)=>{

const xhr=new XMLHttpRequest();


xhr.onload=()=>{

resolve(xhr.response);

};


xhr.onerror=()=>{

if(location.protocol==='file:'){

reject(

new Error(

'Zip environment must be used on a website, not on a local file. To fix this error, use the "Plain HTML" environment instead.'

)

);

}else{

reject(

new Error(

'Request to load project data failed.'

)

);

}

};


xhr.onprogress=(e)=>{

if(e.lengthComputable){

setProgress(

interpolate(

.1,

.2,

e.loaded/e.total

)

);

}

};


xhr.responseType='arraybuffer';

xhr.open(

'GET',

"./assets/project.json"

);

xhr.send();

});

})();

</script>


<script>

const run=async()=>{

const projectData=await getProjectData();

await scaffolding.loadProject(projectData);

setProgress(1);

loadingScreen.hidden=true;


/*
Do NOT start the Scratch project yet.

First show the controls screen.
*/

launchScreen.hidden=false;

};


run().catch(handleError);

</script>


<script>

/*
Start button and 5 second countdown.
*/

let gameStarted=false;


startButton.addEventListener('click',()=>{

if(gameStarted)return;

gameStarted=true;

controlsContent.hidden=true;

countdownContent.hidden=false;

let remaining=5;

countdownElement.textContent=remaining;


const timer=setInterval(()=>{

remaining--;

if(remaining>0){

countdownElement.textContent=remaining;

}else{

clearInterval(timer);

countdownElement.textContent='GO!';


setTimeout(()=>{

launchScreen.hidden=true;

scaffolding.start();

setupMobileJoystick();

},500);

}

},1000);

});

</script>


<script>

function setupMobileJoystick(){

const joystick=document.getElementById('mobile-joystick');

const knob=document.querySelector('.joystick-knob');


if(!joystick||!knob||!window.vm){

return;

}


let active=false;

let pointerId=null;


let pressedKeys=new Set();


const deadZone=8;

const maxDistance=30;


function pressKey(key){

if(pressedKeys.has(key)){

return;

}


try{

vm.runtime.ioDevices.keyboard.postData({

key:key,

isDown:true

});

}catch(error){

console.error(error);

}


pressedKeys.add(key);

}


function releaseKey(key){

if(!pressedKeys.has(key)){

return;

}


try{

vm.runtime.ioDevices.keyboard.postData({

key:key,

isDown:false

});

}catch(error){

console.error(error);

}


pressedKeys.delete(key);

}


function setKeys(keys){

const wantedKeys=new Set(keys);


for(const key of pressedKeys){

if(!wantedKeys.has(key)){

releaseKey(key);

}

}


for(const key of wantedKeys){

if(!pressedKeys.has(key)){

pressKey(key);

}

}

}


function releaseAllKeys(){

for(const key of pressedKeys){

releaseKey(key);

}


pressedKeys.clear();

}


function resetJoystick(){

knob.style.transform='translate(0px, 0px)';

releaseAllKeys();

}


function updateJoystick(clientX,clientY){

const rect=joystick.getBoundingClientRect();


const centerX=rect.left+rect.width/2;

const centerY=rect.top+rect.height/2;


let dx=clientX-centerX;

let dy=clientY-centerY;


const distance=Math.sqrt(dx*dx+dy*dy);


if(distance<deadZone){

resetJoystick();

return;

}


if(distance>maxDistance){

const scale=maxDistance/distance;

dx*=scale;

dy*=scale;

}


knob.style.transform=

'translate('+dx+'px, '+dy+'px)';


const absoluteX=Math.abs(dx);

const absoluteY=Math.abs(dy);


let keys=[];


if(absoluteX>0&&absoluteY>0){

const ratioX=absoluteX/maxDistance;

const ratioY=absoluteY/maxDistance;


if(ratioX>0.35&&ratioY>0.35){

if(dx>0){

keys.push('d');

}else{

keys.push('a');

}


if(dy<0){

keys.push('w');

}else{

keys.push('s');

}

}else if(absoluteX>absoluteY){

if(dx>0){

keys.push('d');

}else{

keys.push('a');

}

}else{

if(dy<0){

keys.push('w');

}else{

keys.push('s');

}

}

}else if(absoluteX>0){

if(dx>0){

keys.push('d');

}else{

keys.push('a');

}

}else if(absoluteY>0){

if(dy<0){

keys.push('w');

}else{

keys.push('s');

}

}


setKeys(keys);

}


joystick.addEventListener('pointerdown',(event)=>{

event.preventDefault();

active=true;

pointerId=event.pointerId;


try{

joystick.setPointerCapture(pointerId);

}catch(error){}


updateJoystick(

event.clientX,

event.clientY

);

});


joystick.addEventListener('pointermove',(event)=>{

if(!active||event.pointerId!==pointerId){

return;

}


event.preventDefault();


updateJoystick(

event.clientX,

event.clientY

);

});


function stopJoystick(event){

if(!active){

return;

}


if(

event&&

event.pointerId!==undefined&&

event.pointerId!==pointerId

){

return;

}


active=false;

pointerId=null;


try{

if(event&&event.pointerId!==undefined){

joystick.releasePointerCapture(event.pointerId);

}

}catch(error){}


resetJoystick();

}


joystick.addEventListener('pointerup',stopJoystick);

joystick.addEventListener('pointercancel',stopJoystick);


joystick.addEventListener('lostpointercapture',()=>{

if(active){

active=false;

pointerId=null;

resetJoystick();

}

});


window.addEventListener('blur',()=>{

active=false;

pointerId=null;

resetJoystick();

});


document.addEventListener('visibilitychange',()=>{

if(document.hidden){

active=false;

pointerId=null;

resetJoystick();

}

});

}

</script>

</body>
</html>
