<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-wrapper">

    <header class="game-header">
      <h1 class="game-title">Tic&nbsp;Tac&nbsp;Toe</h1>
      <a href="../index.html" class="back-button">&larr; Back to Games</a>
    </header>

    <main class="game-container">

      <section class="status-panel" aria-live="polite">
        <p id="statusText" class="status-text">Player X's Turn</p>
      </section>

      <section class="board-wrapper">
        <div id="board" class="board">
          <button class="square" data-index="0" aria-label="Square 1"></button>
          <button class="square" data-index="1" aria-label="Square 2"></button>
          <button class="square" data-index="2" aria-label="Square 3"></button>
          <button class="square" data-index="3" aria-label="Square 4"></button>
          <button class="square" data-index="4" aria-label="Square 5"></button>
          <button class="square" data-index="5" aria-label="Square 6"></button>
          <button class="square" data-index="6" aria-label="Square 7"></button>
          <button class="square" data-index="7" aria-label="Square 8"></button>
          <button class="square" data-index="8" aria-label="Square 9"></button>
        </div>
      </section>

      <section class="controls">
        <button id="resetButton" class="btn-primary">Play Again</button>
      </section>

    </main>

    <footer class="game-footer">
      <p>Made for the Game Site &mdash; Enjoy!</p>
    </footer>

  </div>

<script src="script.js"></script>
</body>
</html>
